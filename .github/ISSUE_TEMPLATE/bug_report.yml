name: Bug Report
description: Report an issue, unexpected error, or crash in Aether
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please search existing issues first to avoid duplicates.
  - type: input
    id: version
    attributes:
      label: Aether Version / Commit Hash
      description: What version of Aether are you using? (e.g. v0.1.0 or commit SHA)
      placeholder: "v0.1.0"
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which part of the system is failing?
      options:
        - "Control Plane Engine (aetherd)"
        - "Raft Consensus (aether-raft)"
        - "WebAssembly Sandbox (aether-wasm)"
        - "CLI Tool (aether-cli)"
        - "TypeScript SDK (@aether/sdk)"
        - "Python SDK (aether-sdk)"
        - "Web Console / Landing"
        - "Docker Compose / Helm Deployment"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: Clear, step-by-step instructions to reproduce the bug.
      placeholder: |
        1. Initialize workflow with `aether run ...`
        2. Worker triggers tool invocation
        3. Observe crash or unexpected state transition
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs / Stack Traces
      description: Please paste relevant logs (run with `LOG_LEVEL=debug` if possible).
      render: shell
  - type: checkboxes
    id: terms
    attributes:
      label: Verification
      options:
        - label: I have searched for existing issues before filing this bug.
          required: true
        - label: I confirm this report does not contain sensitive API keys or passwords.
          required: true
