[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aether-sdk"
version = "0.1.0"
description = "Official Python client SDK for Aether Sovereign Agent OS"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "Aether Platform Team", email = "maintainers@aether.run" }
]
dependencies = [
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "mypy>=1.10.0",
    "ruff>=0.5.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint]
ignore = ["BLE001", "B010"]



